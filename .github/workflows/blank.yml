name: Update Community Day Calendar

on:
  schedule:
    # Run every 6 hours
    - cron: "0 0 * * *"

  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Get your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Install dependencies
      - name: Install dependencies
        run: |
          pip install ics

      # Run your program
      - name: Generate calendar
        run: |
          python pogo-events.py

      # Commit the generated ICS file
      - name: Commit calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add calendars/community-day.ics

          git diff --cached --quiet || git commit -m "Update Community Day calendar"

          git push
